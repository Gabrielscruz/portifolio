<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#090412; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e1b4b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#05010d" stop-opacity="1" />
    </radialGradient>

    <!-- Portal Gradients -->
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#0f0728" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090412" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="suitSuitWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="suitNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1600" height="900" fill="#0c0716" />
  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LEFT SIDE: LOGIN FORM PANEL (Thinkin System)                   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(100, 70)">
    <!-- Thinkin Logo -->
    <g transform="translate(0, 10)">
      <!-- 4-pointed Star Logo -->
      <path d="M 32 8 C 32 20 44 32 56 32 C 44 32 32 44 32 56 C 32 44 20 32 8 32 C 20 32 32 20 32 8 Z" fill="url(#starGrad)" filter="url(#glowPurple)" />
      <circle cx="32" cy="32" r="5" fill="#ffffff" />
      <text x="70" y="40" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">Thinkin</text>
    </g>

    <!-- Login Container -->
    <g transform="translate(30, 150)">
      <!-- Heading -->
      <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">Entrar no sistema</text>
      <text x="0" y="32" fill="#94a3b8" font-size="15" font-weight="400">Use seu login ou e-mail corporativo para continuar</text>

      <!-- Segmented Toggle Tabs [E-mail | Login] -->
      <g transform="translate(0, 68)">
        <rect width="360" height="42" rx="10" fill="#1e182e" stroke="#3b2d54" stroke-width="1.2" />
        <rect x="4" y="4" width="174" height="34" rx="8" fill="#120c20" />
        <text x="91" y="26" fill="#cbd5e1" font-size="14" font-weight="500" text-anchor="middle">E-mail</text>
        <rect x="182" y="4" width="174" height="34" rx="8" fill="#2d1f47" stroke="#8b5cf6" stroke-width="1" />
        <text x="269" y="26" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Login</text>
      </g>

      <!-- Input: Login -->
      <g transform="translate(0, 140)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13" font-weight="600">Login</text>
        <rect x="0" y="12" width="360" height="46" rx="10" fill="#150e26" stroke="#4a3768" stroke-width="1.5" />
        <text x="16" y="40" fill="#f8fafc" font-size="14" font-family="monospace">gabriel.cruz</text>
      </g>

      <!-- Input: Senha -->
      <g transform="translate(0, 226)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13" font-weight="600">Senha</text>
        <rect x="0" y="12" width="360" height="46" rx="10" fill="#150e26" stroke="#4a3768" stroke-width="1.5" />
        <text x="16" y="42" fill="#94a3b8" font-size="20" letter-spacing="4">••••••••••••</text>
        <!-- Eye Icon -->
        <circle cx="332" cy="35" r="7" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <circle cx="332" cy="35" r="2.5" fill="#94a3b8" />
      </g>

      <!-- Forgot Password -->
      <text x="0" y="306" fill="#a78bfa" font-size="13" font-weight="500" cursor="pointer">Esqueceu a senha?</text>

      <!-- Primary Action Button: Acessar conta -->
      <g transform="translate(0, 330)" cursor="pointer">
        <rect width="360" height="50" rx="12" fill="url(#btnGrad)" filter="url(#glowPurple)" />
        <text x="180" y="31" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.3">Acessar conta</text>
      </g>

      <!-- More Logon Options -->
      <text x="180" y="415" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle" cursor="pointer">Mais opções de logon</text>

      <!-- Footer Copyright -->
      <text x="180" y="520" fill="#64748b" font-size="12" text-anchor="middle">© 2026 Thinkin. Todos os direitos reservados.</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: FUTURISTIC SCI-FI PORTAL & CYBER PILOT CHARACTER   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(680, 40)">
    <!-- Framed sci-fi panel container -->
    <rect width="860" height="820" rx="28" fill="#080314" stroke="#4c1d95" stroke-width="2" />
    <rect width="860" height="820" rx="28" fill="url(#portalCore)" />

    <!-- Ambient Grid & Cyber Circuit Floor -->
    <g opacity="0.35">
      <path d="M 50 780 L 810 780 M 100 740 L 760 740 M 150 700 L 710 700 M 200 660 L 660 660" stroke="#06b6d4" stroke-width="1" />
      <path d="M 430 640 L 100 820 M 430 640 L 250 820 M 430 640 L 430 820 M 430 640 L 610 820 M 430 640 L 760 820" stroke="#8b5cf6" stroke-width="1" />
    </g>

    <!-- Holographic Floor Rings -->
    <ellipse cx="430" cy="740" rx="260" ry="60" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#glowCyan)" opacity="0.8" />
    <ellipse cx="430" cy="740" rx="220" ry="50" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />
    <ellipse cx="430" cy="740" rx="160" ry="36" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.9" />

    <!-- Portal Concentric Outer Tech Rings -->
    <g transform="translate(430, 360)">
      <!-- Giant Outer Ring -->
      <circle cx="0" cy="0" r="320" fill="none" stroke="#3b0764" stroke-width="28" opacity="0.6" />
      <circle cx="0" cy="0" r="305" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="16 10" filter="url(#glowPurple)" />
      
      <!-- Vivid Cyan Neon Ring -->
      <circle cx="0" cy="0" r="280" fill="none" stroke="#06b6d4" stroke-width="7" filter="url(#glowCyan)" />
      <circle cx="0" cy="0" r="265" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 8" opacity="0.8" />

      <!-- High Tech Dials & Concentric Arc Runes -->
      <path d="M -240 0 A 240 240 0 0 1 240 0" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6" />
      <path d="M 0 -240 A 240 240 0 0 1 0 240" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="20 15" opacity="0.5" />
      <circle cx="0" cy="0" r="210" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />

      <!-- Energy Nodes on Ring -->
      <circle cx="-280" cy="0" r="10" fill="#22d3ee" filter="url(#glowCyan)" />
      <circle cx="280" cy="0" r="10" fill="#22d3ee" filter="url(#glowCyan)" />
      <circle cx="0" cy="-280" r="10" fill="#c084fc" filter="url(#glowPurple)" />
      <circle cx="0" cy="280" r="10" fill="#c084fc" filter="url(#glowPurple)" />

      <circle cx="-198" cy="-198" r="6" fill="#38bdf8" />
      <circle cx="198" cy="-198" r="6" fill="#38bdf8" />
      <circle cx="-198" cy="198" r="6" fill="#a855f7" />
      <circle cx="198" cy="198" r="6" fill="#a855f7" />
    </g>

    <!-- Floating Sparkles & Light Beams -->
    <g opacity="0.8">
      <circle cx="240" cy="180" r="3" fill="#67e8f9" filter="url(#glowCyan)" />
      <circle cx="620" cy="210" r="4" fill="#d8b4fe" filter="url(#glowPurple)" />
      <circle cx="200" cy="480" r="3.5" fill="#38bdf8" />
      <circle cx="660" cy="520" r="3" fill="#22d3ee" filter="url(#glowCyan)" />
      <circle cx="310" cy="140" r="2" fill="#ffffff" />
      <circle cx="560" cy="150" r="2.5" fill="#ffffff" />
    </g>

    <!-- ── 3D CYBER PILOT AVATAR (Thinkin Character) ── -->
    <g transform="translate(430, 500)">
      <!-- Character Aura/Shadow -->
      <ellipse cx="0" cy="240" rx="90" ry="24" fill="#000000" opacity="0.6" />

      <!-- Kinetic Cyber Legs (Navy with Cyan Energy Lines) -->
      <path d="M -38 100 L -50 210 L -25 215 L -16 100 Z" fill="url(#suitNavy)" />
      <path d="M 38 100 L 50 210 L 25 215 L 16 100 Z" fill="url(#suitNavy)" />
      <!-- Cyan Seams on Legs -->
      <path d="M -44 110 L -48 200" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowCyan)" />
      <path d="M 44 110 L 48 200" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowCyan)" />

      <!-- Cyber Boots (Sneaker Style with Cyan Clasps) -->
      <path d="M -56 205 L -62 235 L -20 238 L -24 205 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 56 205 L 62 235 L 20 238 L 24 205 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <rect x="-54" y="218" width="28" height="6" rx="2" fill="#06b6d4" />
      <rect x="26" y="218" width="28" height="6" rx="2" fill="#06b6d4" />

      <!-- Torso & Suit (White High-Tech Bodysuit) -->
      <path d="M -50 -30 C -55 20 -45 95 -35 110 L 35 110 C 45 95 55 20 50 -30 Z" fill="url(#suitSuitWhite)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Dark Navy Ergonomic Hip/Waist Panels -->
      <path d="M -48 45 C -44 80 -38 105 -35 110 L -15 110 L -24 45 Z" fill="url(#suitNavy)" />
      <path d="M 48 45 C 44 80 38 105 35 110 L 15 110 L 24 45 Z" fill="url(#suitNavy)" />
      <path d="M -15 70 L 15 70 L 12 110 L -12 110 Z" fill="url(#suitNavy)" />

      <!-- Glowing Cyan Circuit Lines across Body -->
      <path d="M -30 -10 C -25 30 -22 65 -15 70" stroke="#06b6d4" stroke-width="3" fill="none" filter="url(#glowCyan)" />
      <path d="M 30 -10 C 25 30 22 65 15 70" stroke="#06b6d4" stroke-width="3" fill="none" filter="url(#glowCyan)" />

      <!-- THINKIN Chest Badge / Logo -->
      <g transform="translate(0, -5)">
        <ellipse cx="0" cy="0" rx="28" ry="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.2" />
        <path d="M 0 -6 L 4 -2 L 0 2 L -4 -2 Z" fill="#a855f7" />
        <text x="0" y="4" fill="#ffffff" font-size="8" font-weight="900" letter-spacing="1" text-anchor="middle">THINKIN</text>
      </g>

      <!-- Crossed Arms in Suit -->
      <path d="M -60 -25 C -75 10 -40 45 0 45 C 40 45 75 10 60 -25 L 44 -28 C 42 15 15 28 0 28 C -15 28 -42 15 -44 -28 Z" fill="url(#suitNavy)" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M -48 -10 L 48 -10" stroke="#22d3ee" stroke-width="2" filter="url(#glowCyan)" />

      <!-- Neck & Collar -->
      <path d="M -18 -55 L 18 -55 L 15 -30 L -15 -30 Z" fill="#fbcfe8" />
      <path d="M -22 -35 L 22 -35 L 18 -26 L -18 -26 Z" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.5" />

      <!-- Head & Cute Confident Face -->
      <ellipse cx="0" cy="-80" rx="36" ry="42" fill="#fde2e4" />
      <!-- Rosy Cheeks -->
      <ellipse cx="-22" cy="-70" rx="7" ry="4" fill="#f43f5e" opacity="0.3" />
      <ellipse cx="22" cy="-70" rx="7" ry="4" fill="#f43f5e" opacity="0.3" />

      <!-- Expressive Anime Big Eyes -->
      <g transform="translate(-16, -82)">
        <ellipse cx="0" cy="0" rx="8" ry="11" fill="#1e1b4b" />
        <ellipse cx="0" cy="2" rx="6" ry="8" fill="#4338ca" />
        <circle cx="2" cy="-3" r="3.5" fill="#ffffff" />
        <circle cx="-2" cy="4" r="1.5" fill="#a5b4fc" />
      </g>
      <g transform="translate(16, -82)">
        <ellipse cx="0" cy="0" rx="8" ry="11" fill="#1e1b4b" />
        <ellipse cx="0" cy="2" rx="6" ry="8" fill="#4338ca" />
        <circle cx="2" cy="-3" r="3.5" fill="#ffffff" />
        <circle cx="-2" cy="4" r="1.5" fill="#a5b4fc" />
      </g>

      <!-- Friendly Smile -->
      <path d="M -8 -63 Q 0 -56 8 -63" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cybernetic Eyebrows -->
      <path d="M -24 -96 Q -16 -100 -8 -96" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 8 -96 Q 16 -100 24 -96" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />

      <!-- Stylish Lavender/Indigo Hair with Voluminous Bangs -->
      <path d="M -42 -85 C -55 -130 55 -130 42 -85 C 55 -70 50 -40 40 -35 C 35 -60 30 -85 24 -95 C 10 -90 -10 -90 -24 -95 C -30 -85 -35 -60 -40 -35 C -50 -40 -55 -70 -42 -85 Z" fill="url(#hairGrad)" stroke="#4338ca" stroke-width="2" />
      <path d="M -26 -115 C 0 -135 30 -125 38 -100 C 20 -108 -5 -105 -26 -92 Z" fill="#c084fc" opacity="0.6" />
      <path d="M -15 -95 Q -5 -80 0 -92 Q 10 -80 18 -95" fill="none" stroke="#7c3aed" stroke-width="3" />
    </g>
  </g>
</svg>
